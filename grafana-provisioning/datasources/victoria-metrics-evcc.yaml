apiVersion: 1

prune: true

datasources:
  - name: VictoriaMetrics-evcc
    type: victoriametrics-metrics-datasource
    access: proxy
    url: http://192.168.1.230:8428
    isDefault: false
    basicAuth: true
    basicAuthUser: ${VM_USER}
    secureJsonData:
      basicAuthPassword: ${VM_PASSWORD}

  - name: prometheus-evcc
    type: prometheus
    access: proxy
    url: http://192.168.1.230:8428
    isDefault: false
    basicAuth: true
    basicAuthUser: ${VM_USER}
    secureJsonData:
      basicAuthPassword: ${VM_PASSWORD}
